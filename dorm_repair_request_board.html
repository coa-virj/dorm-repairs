
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--surface-0);color:var(--text-primary)}
.app{max-width:420px;margin:0 auto;padding:0 0 80px}
.header{background:var(--surface-2);border-bottom:0.5px solid var(--border);padding:16px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:500;color:var(--text-primary)}
.header p{font-size:13px;color:var(--text-secondary);margin-top:2px}
.tab-bar{display:flex;border-bottom:0.5px solid var(--border);background:var(--surface-2);position:sticky;top:61px;z-index:9}
.tab{flex:1;padding:10px 4px;font-size:13px;font-weight:500;text-align:center;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tab.active{color:var(--text-accent);border-bottom:2px solid var(--border-accent)}
.section{padding:16px}
.form-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.form-card h2{font-size:15px;font-weight:500;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;margin-top:12px}
label:first-of-type{margin-top:0}
input,textarea,select{width:100%;padding:9px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-1);color:var(--text-primary);font-size:14px;font-family:inherit}
textarea{resize:vertical;min-height:70px}
.btn{display:block;width:100%;padding:11px;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);margin-top:14px;transition:.15s}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--fill-accent);color:var(--on-accent);border-color:var(--fill-accent)}
.btn-sm{font-size:12px;padding:6px 10px;width:auto;display:inline-block;margin-top:0}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-new{background:var(--bg-accent);color:var(--text-accent)}
.badge-ongoing{background:var(--bg-warning);color:var(--text-warning)}
.badge-done{background:var(--bg-success);color:var(--text-success)}
.request-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.request-card .task{font-size:15px;font-weight:500;margin-bottom:4px}
.request-card .meta{font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.remark-box{background:var(--surface-1);border-left:2px solid var(--border-accent);border-radius:0 var(--radius) var(--radius) 0;padding:8px 10px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
.remark-box strong{display:block;font-size:11px;font-weight:500;color:var(--text-accent);margin-bottom:2px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.section-head{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.count{background:var(--surface-1);border:0.5px solid var(--border);border-radius:20px;padding:1px 7px;font-size:11px;color:var(--text-secondary)}
.empty{text-align:center;padding:28px 16px;color:var(--text-muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--surface-0);padding:10px 18px;border-radius:var(--radius);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}
.manager-note{background:var(--bg-warning);border:0.5px solid var(--border-warning);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text-warning);margin-bottom:16px}
.divider{height:0.5px;background:var(--border);margin:16px 0}
.remark-row{display:flex;gap:6px;margin-top:10px;align-items:flex-end}
.remark-row textarea{min-height:48px;font-size:13px;flex:1;margin:0}
.remark-row button{flex-shrink:0;padding:8px 12px;font-size:12px;white-space:nowrap}
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Dormitory repairs and maintenance request board</h2>

<div class="app">
  <div class="header">
    <h1>Dorm Repairs &amp; Maintenance</h1>
    <p>Submit a request or check its status below</p>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('submit')">Submit request</button>
    <button class="tab" onclick="switchTab('board')">View board</button>
    <button class="tab" onclick="switchTab('manager')">Manager</button>
  </div>

  <div id="tab-submit" class="section">
    <div class="form-card">
      <h2>New repair request</h2>
      <label>Your name</label>
      <input type="text" id="f-name" placeholder="e.g. Juan dela Cruz">
      <label>Room / location</label>
      <input type="text" id="f-room" placeholder="e.g. Room 204, 2nd Floor">
      <label>Date</label>
      <input type="date" id="f-date">
      <label>Describe the issue</label>
      <textarea id="f-task" placeholder="e.g. Leaking faucet in bathroom, broken window latch..."></textarea>
      <button class="btn btn-primary" onclick="submitRequest()">Submit request</button>
    </div>
  </div>

  <div id="tab-board" class="section" style="display:none">
    <div id="board-new"></div>
    <div id="board-ongoing"></div>
    <div id="board-done"></div>
  </div>

  <div id="tab-manager" class="section" style="display:none">
    <div class="manager-note">Manager view — update status and add remarks visible to everyone.</div>
    <div id="mgr-board"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let requests = [];
const STORAGE_KEY = 'dorm_requests_v1';

async function load() {
  try {
    const r = await window.storage.get(STORAGE_KEY, true);
    if (r && r.value) requests = JSON.parse(r.value);
  } catch(e) { requests = []; }
  document.getElementById('f-date').valueAsDate = new Date();
  renderBoard();
  renderManager();
}

async function save() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(requests), true); } catch(e) {}
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function submitRequest() {
  const name = document.getElementById('f-name').value.trim();
  const room = document.getElementById('f-room').value.trim();
  const date = document.getElementById('f-date').value;
  const task = document.getElementById('f-task').value.trim();
  if (!name || !task || !date) { toast('Please fill in all required fields.'); return; }
  const req = { id: Date.now(), name, room, date, task, status: 'new', remark: '' };
  requests.unshift(req);
  save();
  document.getElementById('f-name').value = '';
  document.getElementById('f-room').value = '';
  document.getElementById('f-task').value = '';
  document.getElementById('f-date').valueAsDate = new Date();
  toast('Request submitted!');
  renderBoard();
  renderManager();
}

function statusBadge(s) {
  if (s === 'new') return '<span class="badge badge-new">New</span>';
  if (s === 'ongoing') return '<span class="badge badge-ongoing">On going</span>';
  return '<span class="badge badge-done">Completed</span>';
}

function formatDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function remarkHtml(remark) {
  if (!remark) return '';
  return `<div class="remark-box"><strong>Manager's remark</strong>${esc(remark)}</div>`;
}

function renderBoard() {
  const groups = { new: [], ongoing: [], done: [] };
  requests.forEach(r => (groups[r.status] || groups.new).push(r));

  [
    { key: 'new', label: 'New', el: 'board-new' },
    { key: 'ongoing', label: 'On going', el: 'board-ongoing' },
    { key: 'done', label: 'Completed', el: 'board-done' },
  ].forEach(({ key, label, el }) => {
    const items = groups[key];
    document.getElementById(el).innerHTML = `
      <div class="section-head">${label} <span class="count">${items.length}</span></div>
      ${items.length ? items.map(r => `
        <div class="request-card">
          <div class="task">${esc(r.task)}</div>
          <div class="meta">${esc(r.name)}${r.room ? ' · ' + esc(r.room) : ''} · ${formatDate(r.date)}</div>
          ${statusBadge(r.status)}
          ${remarkHtml(r.remark)}
        </div>`).join('') : '<div class="empty">No requests here yet.</div>'}
      <div class="divider"></div>`;
  });
}

function renderManager() {
  const el = document.getElementById('mgr-board');
  if (!requests.length) { el.innerHTML = '<div class="empty">No requests submitted yet.</div>'; return; }
  el.innerHTML = requests.map(r => `
    <div class="request-card">
      <div class="task">${esc(r.task)}</div>
      <div class="meta">${esc(r.name)}${r.room ? ' · ' + esc(r.room) : ''} · ${formatDate(r.date)}</div>
      ${statusBadge(r.status)}
      <div class="actions">
        ${r.status !== 'new' ? `<button class="btn btn-sm" onclick="move(${r.id},'new')">Mark new</button>` : ''}
        ${r.status !== 'ongoing' ? `<button class="btn btn-sm" onclick="move(${r.id},'ongoing')">On going</button>` : ''}
        ${r.status !== 'done' ? `<button class="btn btn-sm" onclick="move(${r.id},'done')">Completed</button>` : ''}
        <button class="btn btn-sm" style="color:var(--text-danger);border-color:var(--border-danger)" onclick="remove(${r.id})">Delete</button>
      </div>
      <div class="remark-row">
        <textarea id="rmk-${r.id}" placeholder="Add a remark...">${esc(r.remark || '')}</textarea>
        <button class="btn btn-sm" onclick="saveRemark(${r.id})">Save remark</button>
      </div>
    </div>`).join('');
}

function move(id, status) {
  const r = requests.find(x => x.id === id);
  if (r) { r.status = status; save(); renderBoard(); renderManager(); toast('Status updated.'); }
}

function saveRemark(id) {
  const r = requests.find(x => x.id === id);
  const val = document.getElementById('rmk-' + id).value.trim();
  if (r) { r.remark = val; save(); renderBoard(); renderManager(); toast('Remark saved.'); }
}

function remove(id) {
  requests = requests.filter(x => x.id !== id);
  save(); renderBoard(); renderManager(); toast('Request removed.');
}

function switchTab(name) {
  ['submit','board','manager'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === name ? '' : 'none';
    document.querySelectorAll('.tab')[['submit','board','manager'].indexOf(t)].classList.toggle('active', t === name);
  });
  if (name === 'board') renderBoard();
  if (name === 'manager') renderManager();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
